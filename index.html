<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="header">
            <h1>Calculator</h1>
            <button id="themeButton">🌙</button>
        </div>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button id="clearButton" class="special">C</button>
            <button id="deleteButton" class="special">⌫</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>
            <button id="calculateButton" class="equal">=</button>

        </div>

        <div class="history">

            <div class="history-header">
                <h2>History</h2>
                <button id="clearHistory">Clear</button>
            </div>

            <ul id="historyList"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
